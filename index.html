<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Susi ❤️ | Birthday Countdown</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="countdown-page">
  <div class="stars"></div>
  <main class="hero">
    <p class="eyebrow">A little surprise from Yash</p>
    <h1>Something Beautiful Is Coming...</h1>
    <p class="subtitle">The countdown to Susi's special day has begun 💕</p>
    <div id="countdown" class="countdown">
      <div><span id="days">00</span><small>Days</small></div>
      <div><span id="hours">00</span><small>Hours</small></div>
      <div><span id="minutes">00</span><small>Minutes</small></div>
      <div><span id="seconds">00</span><small>Seconds</small></div>
    </div>
    <p id="countdownMessage" class="countdown-message"></p>
    <a id="enterBtn" class="btn disabled" href="home.html">Enter My Surprise ✨</a>
  </main>
  <script src="script.js"></script>
</body>
</html>
